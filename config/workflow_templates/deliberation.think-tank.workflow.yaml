# =============================================================================
# Workflow: Think Tank (Multi-Agent Deliberation) — v2
# =============================================================================
# Structured deliberation on contested, open questions (Plan 79 v2).
#
# v2 architecture: a SINGLE step with input.type=deliberation_loop. The
# dispatch loop routes deliberation_loop tasks to execute_deliberation_loop()
# in modules/backend/agents/mission_control/dispatch/deliberation_loop.py,
# which orchestrates the full 7-agent flow (researcher, verifier, 4 debaters,
# critic, synthesiser) as Python code — mirrors the proven research_loop
# pattern from Plan 40.
#
# The previous 34-step wave-engine version lives at:
#   config/workflow_templates/deliberation.think-tank.v1.workflow.yaml
# (kept for reference; not registered as a separate active workflow.)
#
# Why this architecture instead of 34 wave-engine steps?
#  - The wave engine invokes the Planning Agent before every agent_step.
#    For a 23-agent-step workflow, that is 23 Planning invocations, each
#    a potential failure point. Live testing (~9 runs) surfaced 10 distinct
#    platform bugs in this path.
#  - The deliberation_loop executor calls execute_agent_fn directly with
#    full Python control over the 7-agent dance. No per-step Planning
#    overhead. Tight error handling. Parallel debater dispatch via
#    asyncio.gather.
#  - Debaters can request follow-up research via DebaterTurn.research_requests;
#    the executor dispatches the researcher between rounds when requests
#    are present.
# =============================================================================

workflow_name: deliberation.think-tank.workflow
description: "Multi-agent deliberation for contested open questions"
objective:
  statement: "Produce a structured deliberation on a contested question, preserving live disagreement"
  category: research
  owner: user
  priority: normal
version: 2
enabled: true

trigger:
  type: on_demand
  match_patterns:
    - "deliberate"
    - "think tank"
    - "contested question"

budget:
  # No per-step ceiling fights — single step, single ceiling.
  # Worst case ≈ initial research ($5) + verifier ($1) + 4 opens × $3 + 4
  # critic rounds × $3 + 12 debater turns × $3 + synthesiser ($8) + up to
  # 6 follow-up research calls × $5 = ~$110. Plus headroom for retries.
  max_cost_usd: 150.00

parameters:
  - key: question
    label: "Question"
    type: text
    required: true
    description: "The contested question to deliberate"
    placeholder: "e.g. What will agentic AI do to UK knowledge-work employment by 2030?"
  - key: max_rounds
    label: "Maximum rounds"
    type: number
    required: false
    default: 3
  - key: agreement_intensity
    label: "Agreement intensity (0.0-1.0, lower = less consensus pressure)"
    type: number
    required: false
    default: 0.2
  - key: early_stop_threshold
    label: "Stance-delta threshold for early stop"
    type: number
    required: false
    default: 0.15
  - key: verifier_max_retries
    label: "Verifier retry budget (researcher re-runs with feedback)"
    type: number
    required: false
    default: 3

context:
  question: ""
  max_rounds: 3
  agreement_intensity: 0.2
  early_stop_threshold: 0.15
  verifier_max_retries: 3

steps:
  - id: deliberate
    label: "Think Tank deliberation"
    description: "Execute the 7-agent Think Tank deliberation as a single Python-orchestrated loop"
    capability: deliberation.researcher
    roster: default
    complexity_tier: complex
    cost_ceiling_usd: 150.00
    environment: local
    input:
      # type: deliberation_loop tells the dispatch loop to route this
      # task to execute_deliberation_loop() instead of the standard
      # agent_step path. Same mechanism research uses for its loop.
      type: "deliberation_loop"
      question: "@context.question"
      loop_config:
        max_rounds: "@context.max_rounds"
        agreement_intensity: "@context.agreement_intensity"
        early_stop_threshold: "@context.early_stop_threshold"
        verifier_max_retries: "@context.verifier_max_retries"
    # No output_mapping — execute_deliberation_loop persists artifacts
    # directly (deliberation_deliverable markdown + json, deliberation_transcript
    # json, plus a learning entry).
    timeout_seconds: 5400  # 90 min — generous; most runs finish in 30-45 min
    termination: completion
    depends_on: []
