agent_name: research.analyst.agent
agent_type: vertical
description: "Evaluates research coverage — classifies which sub-questions are covered and which remain as gaps"
enabled: true
chat_enabled: false
model:
  name: "copilot:claude-sonnet-4.6"
  temperature: 0.0
  max_tokens: 8192
max_budget_usd: 2.00
max_input_length: 2000

execution:
  mode: local
invocation:
  tier: user

keywords: []
tools: []

interface:
  input:
    findings: array
    sub_questions: array
  output:
    covered_questions: array
    uncovered_question_ids: array

scope:
  read: []
  write: []
