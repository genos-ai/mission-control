agent_name: research.analyst.agent
agent_type: vertical
description: "Evaluates research coverage — classifies which sub-questions are covered and which remain as gaps"
enabled: true
chat_enabled: false
model: anthropic:claude-sonnet-4-6
max_budget_usd: 2.00
max_input_length: 2000
max_tokens: 8192

execution:
  mode: local
invocation:
  tier: user
keywords:
  - coverage
  - analysis
  - gaps

tools: []

interface:
  input:
    findings: array
    sub_questions: array
  output:
    covered_questions: array
    uncovered_question_ids: array

scope:
  read: []
  write: []
