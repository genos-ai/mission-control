agent_name: research.verifier.agent
agent_type: vertical
description: "NLI-style citation verification — checks whether cited sources support claims"
enabled: true
chat_enabled: false
model:
  name: "foundry:claude-haiku-5-5"
  temperature: 0.0
  max_tokens: 8192
max_budget_usd: 1.00
max_input_length: 2000

execution:
  mode: local
invocation:
  tier: user

keywords: []
tools: []

interface:
  input:
    citations: array
    source_texts: object
  output:
    citation_verdicts: array
    verification_score: number

scope:
  read: []
  write: []
