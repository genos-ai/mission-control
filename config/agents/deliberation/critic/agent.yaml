agent_name: deliberation.critic.agent
agent_type: vertical
description: "Position-free critic for the Think Tank. Invoked every round; attacks the load-bearing assumption of every debater and flags convergence by shared hidden assumption."
enabled: true
chat_enabled: false
model:
  name: "copilot:claude-opus-4.7"
  temperature: 0.4
  max_tokens: 4096
max_budget_usd: 3.00
max_input_length: 100000
timeout_seconds: 600

execution:
  mode: local
invocation:
  tier: user

keywords: []
tools: []

interface:
  input:
    question: string
    research_packet: object
    round_index: number
    positions: object
  output:
    round_index: number
    attacks: object
    convergence_flag: object

scope:
  read: []
  write: []
