agent_name: deliberation.researcher.agent
agent_type: vertical
description: "Assembles the structured evidence packet for the Think Tank deliberation: sourced claims, expert disagreements, mainstream consensus, under-discussed angles, base rates."
enabled: true
chat_enabled: false
model:
  name: "copilot:claude-opus-4.6"
  temperature: 0.2
  max_tokens: 8192
max_budget_usd: 5.00
max_input_length: 20000
timeout_seconds: 900

execution:
  mode: local
invocation:
  tier: user

keywords: []
tools:
  - search_web
  - fetch_url
  - query_knowledge

interface:
  input:
    question: string
  output:
    question_restated: string
    what_is_known: array
    expert_disagreements: array
    mainstream_consensus: string
    under_discussed_angles: array
    base_rates: array

scope:
  read: []
  write: []
