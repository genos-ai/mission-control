# =============================================================================
# Agent Coordinator Configuration
# =============================================================================
# Available options:
#   routing               - Routing configuration (object)
#     strategy            - Routing strategy (string: rule | llm | hybrid)
#     llm_model           - Model for LLM-based routing fallback (string)
#     complex_request_agent - Agent for multi-step requests (string)
#     fallback_agent      - Default agent when routing fails (string)
#     max_routing_depth   - Maximum delegation depth (integer)
#   model_pricing         - Cost per million tokens by model (object)
#     {model_name}        - Model identifier (object)
#       input             - Cost per 1M input tokens in USD (decimal)
#       output            - Cost per 1M output tokens in USD (decimal)
#     default             - Fallback pricing when model not listed (object)
#   limits                - Budget and safety limits (object)
#     max_requests_per_task    - Max LLM calls per task (integer)
#     max_tool_calls_per_task  - Max tool invocations per task (integer)
#     max_tokens_per_task      - Max tokens per task (integer)
#     max_cost_per_plan        - Max USD per plan (decimal)
#     max_cost_per_user_daily  - Max USD per user per day (decimal)
#     task_timeout_seconds     - Wall-clock timeout per task (integer)
#     plan_timeout_seconds     - Wall-clock timeout per plan (integer)
#   dispatch              - Dispatch loop defaults (object)
#     default_request_limit    - Safety-cap LLM requests per task (integer)
#     token_cost_factor        - Tokens per dollar of cost ceiling (integer)
#     context_token_budget     - Token budget for assembled context packet (integer)
#     history_reserve_tokens   - Tokens reserved for Layer 2 history (integer)
#   escalation            - Deterministic risk thresholds (object)
#     max_auto_approve_cost_usd   - Max cost for auto-approval (decimal)
#     max_medium_approve_cost_usd - Max cost for medium-risk approval (decimal)
#     max_auto_approve_retries    - Max retries auto-approved (integer)
#   guardrails            - Input validation settings (object)
#     max_input_length    - Maximum input character count (integer)
#     injection_patterns  - Regex patterns to block (list of strings)
#   redis_ttl             - Redis key TTLs in seconds (object)
#     session             - Session history TTL (integer)
#     approval            - Pending approval TTL (integer)
#     lock                - Distributed lock TTL (integer)
#     result              - Async result TTL (integer)
#   approval              - HITL approval settings (object)
#     poll_interval_seconds - Polling interval (integer)
#     timeout_seconds       - Max wait for approval (integer)
# =============================================================================

model_pricing:
  "copilot:claude-haiku-4.5":
    input: 1.00
    output: 5.00
    cache_read: 0.10
    cache_write_5m: 1.25
    cache_write_1h: 2.00
  "copilot:claude-sonnet-4.6":
    input: 3.00
    output: 15.00
    cache_read: 0.30
    cache_write_5m: 3.75
    cache_write_1h: 6.00
  "copilot:claude-opus-4.6":
    input: 15.00
    output: 75.00
    cache_read: 1.50
    cache_write_5m: 18.75
    cache_write_1h: 30.00
  "anthropic:claude-opus-4-7":
    input: 5.00
    output: 25.00
    cache_read: 0.50
    cache_write_5m: 6.25
    cache_write_1h: 10.00
  # Plan 82 — illustrative rates; verify against the Foundry pricing page for the
  # deployment region before the Phase 2 canary flip. cache_read kept; cache_write
  # fields omitted because Azure OpenAI v1 doesn't surface cache_write events
  # (and ModelPricingRateSchema defaults the missing fields to 0.0).
  "foundry:gpt-4.1":
    input: 2.50
    output: 10.00
    cache_read: 0.625
  # gpt-5.4 family — Foundry pricing confirmed 2026-06-05 from
  # techcommunity.microsoft.com/blog/azure-ai-foundry-blog/introducing-gpt-5-4-in-microsoft-foundry/
  # and Azure rate sheets. Rates are for context ≤272K tokens (the >272K tier
  # is roughly 2x and is not currently used by any agent). cache_write omitted
  # for the same reason as gpt-4.1.
  "foundry:gpt-5.4":
    input: 2.50
    output: 15.00
    cache_read: 0.25
  "foundry:gpt-5-mini":
    input: 0.25
    output: 2.00
    cache_read: 0.025
  "foundry:gpt-5-nano":
    input: 0.05
    output: 0.40
    cache_read: 0.005
  # Claude 5.5 on Foundry — rates from platform.claude.com/docs/en/about-claude/pricing
  # (checked 2026-11-07). Foundry bills Claude at Anthropic's standard per-model rates
  # (invoiced in CCUs); these deployments are GlobalStandard, so no 1.1x data-zone
  # multiplier. Haiku 5.5 is tiered: the rates below are for prompts up to 100,000
  # tokens, and prompts above that cost 5x. ModelPricingRateSchema has no tier field,
  # so cost is understated for those requests.
  "foundry:claude-haiku-5-5":
    input: 0.10
    output: 0.50
    cache_read: 0.01
    cache_write_5m: 0.125
    cache_write_1h: 0.20
  "foundry:claude-sonnet-5-5":
    input: 2.00
    output: 10.00
    cache_read: 0.10
    cache_write_5m: 2.50
    cache_write_1h: 4.00
  "foundry:claude-opus-5-5":
    input: 4.00
    output: 20.00
    cache_read: 0.20
    cache_write_5m: 5.00
    cache_write_1h: 8.00
  default:
    input: 3.00
    output: 15.00
    cache_read: 0.30
    cache_write_5m: 3.75
    cache_write_1h: 6.00

routing:
  strategy: hybrid
  llm_model: foundry:claude-haiku-5-5
  complex_request_agent: horizontal.pm.agent
  fallback_agent: platform.health.agent
  chat_agent: mission.director.agent
  max_routing_depth: 3

limits:
  max_requests_per_task: 10
  max_tool_calls_per_task: 25
  max_tokens_per_task: 200000
  max_cost_per_plan: 10.00
  max_cost_per_user_daily: 50.00
  task_timeout_seconds: 300
  plan_timeout_seconds: 1800

guardrails:
  max_input_length: 32000
  injection_patterns:
    - "ignore (all |previous |prior )?instructions"
    - "you are now"
    - "system prompt:"
    - "disregard (your |all )?previous"

redis_ttl:
  session: 3600
  approval: 86400
  lock: 30
  result: 3600

dispatch:
  default_request_limit: 50
  token_cost_factor: 500000  # tokens per dollar of cost ceiling (1M/2)
  context_token_budget: 50000  # assembled context budget (PCD + Code Map + history)
  history_reserve_tokens: 1500  # reserved for Layer 2 history within context budget

escalation:
  max_auto_approve_cost_usd: 1.00
  max_medium_approve_cost_usd: 10.00
  max_auto_approve_retries: 3

approval:
  poll_interval_seconds: 2
  timeout_seconds: 300
