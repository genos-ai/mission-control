# =============================================================================
# Summarization Agent Configuration
# =============================================================================
# Compresses mission outcomes into concise milestone summaries for the
# fractal summarization pipeline.
#
# Plan 82 Phase 2 canary: switched from copilot:claude-haiku-4.5 to
# foundry:gpt-4.1 on 2026-05-27. Low blast radius (failures only affect
# knowledge extraction, not dispatch). Roll back by changing the model
# back and re-seeding.
# =============================================================================

agent_name: system.summarization.agent
agent_type: horizontal
description: "Compresses mission outcomes into concise milestone summaries"
enabled: true
model: foundry:gpt-4.1
max_input_length: 32000
max_budget_usd: 0.05

keywords: []

tools: []

scope:
  read: []
  write: []

execution:
  mode: local
invocation:
  tier: system

interface:
  input:
    mission_outcomes: list
    target_length: int
  output:
    title: str
    summary: str
    key_outcomes: list
    domain_tags: list

version: "1.0.0"
