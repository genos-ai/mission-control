# Mission Director Agent Configuration
#   Conversational mission delegate for mc chat. Answers questions about
#   the mission, triggers runs, queries history, and manages the mission
#   on behalf of the user.
#
#   Model: Sonnet 4.6 — fast, cost-effective for tool routing and delegation.
#   Opus not needed — the Director delegates work, it doesn't reason deeply.

agent_name: mission.director.agent
agent_type: horizontal
description: >-
  Conversational mission delegate. Answers questions about the mission,
  triggers runs, queries history, and resolves approval gates on behalf
  of the user.
enabled: true
chat_enabled: true
version: "1.0.0"

model:
  name: "foundry:claude-opus-5-5"
  temperature: 1.0
  max_tokens: 16384

keywords:
  - mission
  - director
  - delegate

tools:
  # Mission info & context
  - get_mission_info
  - get_mission_context
  - get_current_mission_intent
  - capture_mission_intent
  # Team & catalog
  - list_team
  - browse_catalog
  # Execution history
  - get_execution_history
  - get_execution_detail
  - check_background_tasks
  # Plan
  - get_plan
  - refine_plan
  - approve_plan_tasks
  # Workflows
  - list_workflows
  - run_workflow
  - design_workflow
  # Objective / direct run
  - run_objective
  # Artifacts & knowledge
  - get_artifacts
  - query_knowledge

  - declare_objective_met
max_input_length: 64000
max_budget_usd: 5.00

execution:
  mode: local
invocation:
  tier: user

scope:
  read:
    - "config/"
    - "modules/"
    - "var/logs/"
  write: []

interface:
  input:
    message: "string"
  output:
    result: "string"
effort: medium
thinking_budget:
  max_thinking_tokens: 0
