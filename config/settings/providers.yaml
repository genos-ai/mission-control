# Provider authentication configuration.
#
# Controls how PydanticAI agents authenticate with LLM providers.
# Switch auth_mode without changing any agent code or config.
#
# Auth modes:
#   api_key       — standard API key (default, billed per-token)
#   auth_token    — subscription/OAuth bearer token (blocked by Anthropic API)
#   codex_oauth   — ChatGPT subscription OAuth (blocked by OpenAI API)
#   entra         — Azure Entra ID via DefaultAzureCredential (foundry-only)
#   bearer_token  — pre-fetched Azure bearer from env (foundry-only)
#
# Keys per provider block (anthropic, openai, foundry, foundry_project):
#   auth_mode        — one of the modes above
#   env_var          — environment variable holding the key or token
#   base_url         — endpoint override
#   scope            — Entra token scope (foundry-only)
#   subscription_id  — Azure subscription (foundry-only, discovery)
#   resource_group   — Azure resource group (foundry-only, discovery)
#   account_name     — Azure resource name (foundry-only, discovery)
#   endpoint_paths   — path appended to base_url per wire protocol (foundry, foundry_project)
#   deployment_protocols — deployment format the provider reports -> the protocol it
#                      answers, used by `catalog discover` to catch a model registered
#                      under the wrong protocol
#
# Both Anthropic and OpenAI reject subscription OAuth tokens for
# programmatic API access. Subscription auth only works through
# their official CLI tools (Claude Code, Codex CLI).
#
# For $0 agent execution, use engine: claude_code on coding agents
# (Plan 55). Orchestration agents require API key billing.

anthropic:
  auth_mode: api_key
  env_var: ANTHROPIC_API_KEY
  deployment_protocols:
    Anthropic: anthropic_messages

openai:
  auth_mode: api_key
  env_var: OPENAI_API_KEY

# Foundry — Azure AI Foundry (Azure OpenAI on Foundry, v1 GA endpoint).
#
# Auth modes (in priority order):
#   entra         — DefaultAzureCredential + scope (recommended; picks up
#                   `az login` locally and managed identity in prod).
#                   No env_var required.
#   api_key       — static API key from env_var (set env_var: AZURE_OPENAI_API_KEY)
#   bearer_token  — pre-fetched bearer from env_var (set env_var: AZURE_OPENAI_AUTH_TOKEN)
#
# base_url is the resource endpoint WITHOUT the /openai/v1/ suffix —
# get_foundry_provider() appends it.
#
# subscription_id, resource_group and account_name locate the resource in Azure
# Resource Manager. They are used only by `admin.py catalog discover` to list the
# model deployments; calling models does not need them. account_name is the Azure
# resource name, which can differ from the base_url hostname.
foundry:
  auth_mode: entra
  base_url: https://gis-mission-control-resource.openai.azure.com
  scope: https://ai.azure.com/.default
  subscription_id: e9ae84d8-7fa3-49c1-838e-81ce8a57a576
  resource_group: rg-secrch-mission-control-dev-001
  account_name: gis-mission-control-resource
  # Claude is served only over the Anthropic Messages API; every other model format
  # answers OpenAI chat completions. A format missing from deployment_protocols is
  # reported by `catalog discover` so it can be added here.
  endpoint_paths:
    openai_chat: /openai/v1/
    anthropic_messages: /anthropic
  deployment_protocols:
    Anthropic: anthropic_messages
    OpenAI: openai_chat
    DeepSeek: openai_chat
    MoonshotAI: openai_chat
    Microsoft: openai_chat

# Foundry Project — project-scoped Foundry endpoint, used by Agent Service
# features that need project-level connections (e.g. Bing Grounding for the
# `web_search` tool on the Responses API). Different host + path shape from
# the OpenAI-compatible `foundry:` endpoint above.
#
# base_url format: https://<account>.services.ai.azure.com/api/projects/<project>
# Same Entra auth as `foundry:`. The Responses API lives under
# /openai/v1/responses relative to the project root, so the SDK base_url is
# `<base_url>` plus endpoint_paths.openai_responses, composed by
# get_foundry_project_provider().
foundry_project:
  auth_mode: entra
  base_url: https://gis-mission-control-resource.services.ai.azure.com/api/projects/gis-mission-control
  scope: https://ai.azure.com/.default
  endpoint_paths:
    openai_responses: /openai/v1/

# Copilot SDK client health: how often the shared client is pinged and how long
# one ping may take before the client is treated as unhealthy.
copilot_client:
  health_check_interval_seconds: 300
  ping_timeout_seconds: 10
