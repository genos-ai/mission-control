# =============================================================================
# Model Alias Configuration
# =============================================================================
# Named aliases for model selection. Workflow steps reference aliases
# (quick, moderate, comprehensive) instead of literal provider:model strings.
# Changing provider here propagates to all workflows instantly.
#
# Naming mirrors the research depth presets (research.yaml):
#   quick         — fast, low-cost model for classification and routing
#   moderate      — balanced model for general tasks and summaries
#   comprehensive — most capable model for complex analysis and synthesis
#
# To switch all workflows to a different provider:
#   python admin.py catalog aliases set quick anthropic:claude-haiku-4-5
#   python admin.py catalog aliases set moderate anthropic:claude-sonnet-4-6
#   python admin.py catalog aliases set comprehensive anthropic:claude-opus-4-6
# =============================================================================

aliases:
  quick: "foundry:claude-haiku-5-5"
  moderate: "foundry:claude-sonnet-5-5"
  comprehensive: "foundry:claude-opus-5-5"

# =============================================================================
# Provider → Model Registry
# =============================================================================
# Authoritative list of valid models: {provider: {model: {protocol, ...}}}.
# The entry decides how a model is built, so a model that is not listed here
# cannot be used.
#
# A provider is where a model is hosted and how we authenticate (providers.yaml);
# a protocol is how we talk to it. One provider can serve several protocols:
# Foundry serves GPT, DeepSeek and similar over openai_chat, and Claude only over
# anthropic_messages. The supported pairs are defined in
# modules/backend/core/model_backends.py and checked when this file loads.
#
# Keys per model:
#   protocol   required, one of:
#                openai_chat         OpenAI chat completions
#                anthropic_messages  Anthropic Messages API
#                copilot_sdk         GitHub Copilot SDK
#   thinking   anthropic_messages only. "budget" (default) takes an explicit
#              thinking-token budget; "adaptive" is for models that reject one
#              (the API answers 400 'thinking.type.enabled is not supported').
#   output_mode  structured output for agents on this model, unless the agent's
#              model block sets its own. "tool" (default) forces a final_result
#              tool call; "prompted" (openai_chat, anthropic_messages) puts the
#              schema in the instructions, for models that reject a forced tool
#              choice; "native" (openai_chat) uses response_format json_schema.
#              `python admin.py catalog ping` makes a structured-output call, so
#              a model that rejects its mode fails there.
#
# To add a model: list it under its provider, then add its rates to model_pricing
# in config/agents/mission_control.yaml.
#   `python admin.py catalog discover --provider foundry` shows what is deployed
#   and fails if a model is filed under a protocol its deployment cannot speak.
# To remove a model: ensure no agent_catalog row references it first.
# Admin catalog writes are validated against this list when model_config_json.name
# is being CHANGED; building a model validates it every time.

registry:
  anthropic:
    claude-opus-4-6: {protocol: anthropic_messages, thinking: adaptive}
    claude-sonnet-4-6: {protocol: anthropic_messages, thinking: adaptive}
    claude-haiku-4-5: {protocol: anthropic_messages}
  copilot:
    claude-opus-4.6: {protocol: copilot_sdk}
    claude-sonnet-4.6: {protocol: copilot_sdk}
    claude-haiku-4.5: {protocol: copilot_sdk}
  foundry:
    gpt-4.1: {protocol: openai_chat}
    gpt-5.4: {protocol: openai_chat}
    gpt-5-mini: {protocol: openai_chat}
    gpt-5-nano: {protocol: openai_chat}
    claude-haiku-5-5: {protocol: anthropic_messages, thinking: adaptive}
    # Rejects a forced tool choice (HTTP 400 "tool_choice: type \"tool\" and \"any\"
    # are not supported for this model"), so structured output is prompted.
    claude-sonnet-5-5: {protocol: anthropic_messages, thinking: adaptive, output_mode: prompted}
    claude-opus-5-5: {protocol: anthropic_messages, thinking: adaptive}
