# =============================================================================
# Model Alias Configuration
# =============================================================================
# Named aliases for model selection. Workflow steps reference aliases
# (quick, moderate, comprehensive) instead of literal provider:model strings.
# Changing provider here propagates to all workflows instantly.
#
# Naming mirrors the research depth presets (research.yaml):
#   quick         — fast, low-cost model for classification and routing
#   moderate      — balanced model for general tasks and summaries
#   comprehensive — most capable model for complex analysis and synthesis
#
# To switch all workflows to a different provider:
#   python admin.py catalog aliases set quick anthropic:claude-haiku-4-5
#   python admin.py catalog aliases set moderate anthropic:claude-sonnet-4-6
#   python admin.py catalog aliases set comprehensive anthropic:claude-opus-4-6
# =============================================================================

aliases:
  quick: "copilot:claude-haiku-4.5"
  moderate: "copilot:claude-sonnet-4.6"
  comprehensive: "copilot:claude-opus-4.6"

# =============================================================================
# Provider → Models Registry
# =============================================================================
# Authoritative list of valid {provider: [models]} combinations.
# Source of truth for the model picker in /admin/catalog and for backend
# validation on PATCH /admin/catalog/{agent_name}.
#
# To add a model: list it under its provider here.
# To remove a model: ensure no agent_catalog row references it first.
# Validation only runs when model_config_json.name is being CHANGED, so
# removed-but-still-referenced models won't break running agents.

registry:
  anthropic:
    - claude-opus-4-6
    - claude-sonnet-4-6
    - claude-haiku-4-5
  copilot:
    - claude-opus-4.6
    - claude-sonnet-4.6
    - claude-haiku-4.5
  foundry:
    - gpt-4.1
    - gpt-5.4
    - gpt-5-mini
    - gpt-5-nano
