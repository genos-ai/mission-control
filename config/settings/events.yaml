# =============================================================================
# Event Configuration
# =============================================================================
#   Session events use Redis Pub/Sub for real-time delivery (SSE to browser).
#   All events are persisted to the mission_events DB table by default,
#   EXCEPT those in exclude_event_types (high-volume noise).
#
#   Channel naming: mission_events:{mission_id} (one channel per mission)
#
#   To hide an event type from the Console timeline, add it to
#   exclude_event_types. Everything else persists automatically —
#   new event types show up without config changes.

transport: redis

streams:
  default:
    maxlen: 10000
    consumer_group: mc-workers

consumer_timeout_ms: 5000
dlq_enabled: true
dlq_prefix: dlq

# exclude_event_types: high-volume event types excluded from DB persistence.
# These stream live via SSE but are NOT written to mission_events.
# Everything NOT listed here persists and appears in the Console timeline.
exclude_event_types:
  # Streaming deltas — hundreds per agent turn, no historical value
  - agent.response.chunk
  # Redundant — cost is on agent.response.complete
  - session.cost.update
