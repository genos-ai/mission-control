# =============================================================================
# Event Bus Configuration
# =============================================================================
#   Controls the FastStream event bus, stream sizing, and consumer behavior.
#   Transport: "redis" for production, "memory" for testing.
#
#   Two event systems:
#     Domain events (FastStream + Redis Streams): durable, consumer groups, DLQ
#     Session events (Redis Pub/Sub): ephemeral, real-time agent lifecycle
#
#   Stream naming: {domain}:{entity}-{action} (e.g. notes:note-created)
#   Channel naming: mission_events:{mission_id} (one channel per mission)
#
#   persist_event_types: event types written to the mission_events DB table
#   for historical narrative display. High-volume types (response chunks,
#   cost updates) are excluded to avoid DB bloat.

transport: redis

streams:
  default:
    maxlen: 10000
    consumer_group: mc-workers

consumer_timeout_ms: 5000
dlq_enabled: true
dlq_prefix: dlq

persist_event_types:
  - agent.thinking.started
  - agent.tool.called
  - agent.tool.returned
  - plan.step.started
  - plan.step.completed
  - system.execution.created
  - system.execution.completed
  - system.info              # SystemEvent — errors/warnings bridged from logger
  - mission.artifact.found
  - mission.narrative
