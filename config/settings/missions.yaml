# =============================================================================
# Mission System Configuration
# =============================================================================
# Available options:
#   default_budget_ceiling_usd  - Default mission budget ceiling (float, nullable)
#   max_missions_per_owner      - Maximum missions per owner (integer)
#   pcd_max_size_bytes          - Mission Context Document hard size cap in bytes (integer, 20480 = 20KB)
#   pcd_target_size_bytes       - MCD target size in bytes (integer, 15360 = 15KB)
#   pcd_prune_threshold_pct     - Trigger pruning at this % of max (integer, 80)
#   pcd_alert_threshold_pct     - Alert owner at this % of max (integer, 90)
#   history_summarize_after_days - Summarize task executions older than N days (integer)
#   enable_context_assembly     - Enable context assembly in dispatch loop (boolean)
# =============================================================================

default_budget_ceiling_usd: null
max_missions_per_owner: 50
pcd_max_size_bytes: 20480
pcd_target_size_bytes: 15360
pcd_prune_threshold_pct: 80
pcd_alert_threshold_pct: 90
history_summarize_after_days: 30
enable_context_assembly: true

# =============================================================================
# Knowledge Platform (Plan 57)
# =============================================================================
knowledge:
  enabled: true

  embedding:
    provider: openai                    # openai | voyage | local
    model: text-embedding-3-small       # 1536 dims
    dimensions: 1536
    version: 1                          # bumps trigger backfill
    backfill_batch_size: 50
    default_search_mode: hybrid
    fail_open: true                     # provider outage → structured-only fallback

  learnings:
    min_occurrence_for_extraction: 2
    promotion_confidence_threshold: 0.7
    promotion_min_missions: 2
    context_assembler_reserve_tokens: 1500
    context_assembler_max_entries: 5
    extraction_window_days: 30          # learning extraction look-back window
    dedup_similarity_threshold: 0.92    # cosine; above = increment, not create
    evidence_render_limit: 20           # UI pagination only

  intent:
    auto_capture: true
    summary_max_chars: 160
    dedup_similarity_threshold: 0.95

  session_memory:
    compression_threshold_messages: 50
    summary_max_tokens: 8000

  officer:
    budget_usd_per_run: 0.10
    model: haiku

# =============================================================================
# Recurring missions (Plan 88)
# =============================================================================
recurrence:
  enabled: true                             # false: schedule create rejected; sync deletes every mission schedule
  default_catch_up_window_seconds: 21600    # 6h
  max_catch_up_window_seconds: 604800
  min_interval_seconds: 300                 # cron firing more often than this is rejected
  max_schedules_per_mission: 5
  objective_template_max_chars: 4000

# =============================================================================
# Memory between runs (Plan 88 Phase 3)
# =============================================================================
digest:
  agent_name: "mission.digest.agent"   # catalog agent, config/agents/mission/digest/agent.yaml
  summary_max_chars: 2000
  max_outcomes: 50
  headline_max_chars: 200              # outcome headline and open-item text truncation
  task_excerpt_max_chars: 1500         # per-task output excerpt sent to the digest agent
  agent_output_retries: 2              # pydantic-ai output_retries for the digest agent
context_packet:
  previous_digest_max_chars: 4000
  context_delta_max_changes: 100
  context_delta_max_tokens: 2000
  context_delta_value_max_chars: 200
  assembly_order: [previous_run_digest, context_delta, code_map, learnings, history]
compaction:
  decisions_max_age_days: 90
  keep_recent_milestones: 5
  protected_roots: [identity, guardrails, current_state]
