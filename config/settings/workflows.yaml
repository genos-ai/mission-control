# =============================================================================
# Workflow Configuration
# =============================================================================
# Available options:
#   workflows_dir              - Directory to scan for workflow YAML files (string)
#   max_steps_per_workflow     - Maximum steps in a single workflow (integer)
#   max_context_size_bytes     - Maximum mission context size in bytes (integer)
#   default_step_timeout_seconds - Default timeout per step if not specified (integer)
#   default_budget_usd         - Default workflow budget if not specified (float)
#   max_budget_usd             - Hard cap on workflow budget (float)
#   max_concurrent_missions    - Maximum workflow runs simultaneously (integer)
#   enable_workflow_matching   - Enable Mission Control workflow matching fast-path (boolean)
#   default_step_model         - models.yaml alias that new LLM-call and decision steps start with (string, required)
# =============================================================================

workflows_dir: "config/workflow_templates"
max_steps_per_workflow: 50
max_context_size_bytes: 1048576
default_step_timeout_seconds: 600
default_budget_usd: 10.00
max_budget_usd: 100.00
max_concurrent_missions: 10
enable_workflow_matching: true
default_step_model: quick

# Workshop (single-agent sandbox) settings
workshop:
  max_cached_input_sets: 10
  default_budget_usd: 2.00
  max_budget_usd: 20.00
  cache_stale_days: 7
