repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: debug-statements

  # Formatter/linter revs must match the local dev environment and CI
  # (see .github/workflows/ci.yml) — version skew reformats endlessly.
  - repo: https://github.com/psf/black
    rev: 26.3.1
    hooks:
      - id: black
        args: ["--line-length=100"]

  - repo: https://github.com/pycqa/isort
    rev: 8.0.1
    hooks:
      - id: isort

  - repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
      - id: flake8

  - repo: local
    hooks:
      - id: code-rules
        name: code rules (fast)
        entry: python scripts/code_rules_fast.py
        language: system
        types: [python]
        pass_filenames: false

      - id: codemap
        name: regenerate .codemap/map.md
        entry: python scripts/code_map.py --scope modules/
        language: system
        types: [python]
        pass_filenames: false

      - id: check-docs
        name: documentation references (links + documented commands)
        entry: python scripts/check_docs.py
        language: system
        types: [markdown]
        pass_filenames: false
