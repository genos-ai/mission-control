# =============================================================================
# Project Configuration
# =============================================================================
# Consolidates tool configuration per architecture doc 08-core-python-coding-standards.
# Tools: black, isort, mypy, pytest, pytest-cov.
# flake8 uses .flake8 (no pyproject.toml support).
# =============================================================================

[project]
name = "mission-control"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    # Core Framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    # Database
    "sqlalchemy>=2.0.25",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.0",
    "greenlet>=3.0.0",
    "alembic>=1.13.0",
    "pgvector>=0.2.5",
    # Redis
    "redis>=5.0.0",
    # HTTP Client
    "httpx>=0.26.0",
    # Telegram Bot
    "aiogram>=3.4.0",
    "aiobreaker>=1.2.0",
    # Security
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.6",
    # Logging & Observability
    "structlog>=24.1.0",
    "langfuse>=2.40.0",
    # AI Agents
    "pydantic-ai>=1.63.0",
    "jsonschema>=4.20.0",
    # CLI agent engines (Plan 55)
    "claude-agent-sdk>=0.1.0",
    # Subscription-based model auth (Plan 55/58)
    "codex-auth>=0.1.0",
    # Azure Entra ID auth for Foundry provider (Plan 82)
    "azure-identity>=1.17.1",
    # Foundry deployment discovery (catalog discover)
    "azure-mgmt-cognitiveservices>=13.5.0",
    # Trust the OS certificate store for outbound TLS (corporate inspection proxies)
    "truststore>=0.10.0",
    # Durable Execution
    "temporalio>=1.20.0",
    # Agent execution isolation (Plan 47): containerized user-tier agents
    "docker>=7.0.0",
    # Research (Plan 40)
    "tavily-python>=0.5.0",
    "trafilatura>=2.0.0",
    "readability-lxml>=0.8.1",
    # Configuration
    "pyyaml>=6.0.1",
    # Comment-preserving YAML edits (catalog sync-yaml)
    "ruamel.yaml>=0.18",
    "python-dotenv>=1.0.0",
    # CLI
    "click>=8.1.0",
    "rich>=13.7.0",
    # TUI
    "textual>=1.0.0",
    # Service management (services.py: detect worker process by cmdline)
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "aiosqlite>=0.19.0",
    "black>=24.1.0",
    "isort>=5.13.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

# =============================================================================
# Black — Code Formatting
# =============================================================================
[tool.black]
line-length = 100
target-version = ["py312"]

# =============================================================================
# isort — Import Sorting
# =============================================================================
[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["modules", "config"]

# =============================================================================
# mypy — Type Checking
# =============================================================================
[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
no_implicit_reexport = true
strict_equality = true

# Third-party libraries without type stubs
[[tool.mypy.overrides]]
module = [
    "temporalio.*",
    "aiogram.*",
    "aiobreaker.*",
    "langfuse.*",
    "slowapi.*",
    "textual.*",
    "rich.*",
    "jose.*",
    "redis.*",
    "aiosqlite.*",
    "pydantic_ai.*",
]
ignore_missing_imports = true

# =============================================================================
# pytest — Testing
# =============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-v --strict-markers --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests (require database)",
    "e2e: End-to-end tests (full stack)",
    "slow: Slow running tests",
]

# =============================================================================
# =============================================================================
# import-linter — Layer Enforcement
# =============================================================================
# Prevents the service ↔ agent import cycle from regrowing.
# Run: lint-imports (or: python -m importlinter)
# =============================================================================
[tool.importlinter]
root_packages = ["modules"]

# Rule 1: services must not import from agents
# The remaining exceptions are the dispatch cycle (handle_mission etc.)
# and agent wrapper services (workflow_architect, workshop) that are
# coupled by design. Each is documented. No new exceptions without review.
[[tool.importlinter.contracts]]
name = "Services layer must not import from agents layer"
type = "forbidden"
source_modules = ["modules.backend.services"]
forbidden_modules = ["modules.backend.agents"]
ignore_imports = [
    # Dispatch cycle — services call into agent dispatch (needs service layer split)
    "modules.backend.services.mission_plan_orchestrator -> modules.backend.agents.mission_control.mission_control",
    "modules.backend.services.mission_plan_orchestrator -> modules.backend.agents.mission_control.gate",
    "modules.backend.services.mission_plan_orchestrator -> modules.backend.agents.mission_control.gate_post_run",
    "modules.backend.services.mission_plan_orchestrator -> modules.backend.agents.adapters.supervisor_introspection",
    "modules.backend.services.mission_plan_orchestrator -> modules.backend.agents.mission_control.helpers.agent_executor",
    "modules.backend.services.mission_plan_orchestrator -> modules.backend.agents.mission_control.plan_validator",
    "modules.backend.services.mission_plan_orchestrator -> modules.backend.agents.mission_control.roster",
    "modules.backend.services.mission_plan_orchestrator -> modules.backend.agents.mission_control.helpers.prompt_builder",
    "modules.backend.services.execution -> modules.backend.agents.mission_control.dispatch_adapter",
    "modules.backend.services.session_memory -> modules.backend.agents.system.summarization.agent",
    # Agent wrapper services — coupled by design (they ARE agent orchestrators)
    "modules.backend.services.workflow_architect -> modules.backend.agents.mission.workflow.agent",
    "modules.backend.services.workflow_architect -> modules.backend.agents.mission.workflow.deps",
    "modules.backend.services.workflow_architect -> modules.backend.agents.deps.base",
    "modules.backend.services.workflow_architect -> modules.backend.agents.mission_control.helpers",
    "modules.backend.services.workshop -> modules.backend.agents.mission_control.helpers",
    "modules.backend.services.workshop -> modules.backend.agents.mission_control.cost",
    # Transitive through temporal (lazy imports inside activities)
    "modules.backend.services.mission_learning -> modules.backend.temporal.knowledge_activities",
    "modules.backend.services.mission_plan_orchestrator -> modules.backend.temporal.mission_run_workflow",
    "modules.backend.services.execution_dispatch -> modules.backend.temporal.workflow",
]

# Rule 2: core must not import from services (auth DI is the exception)
[[tool.importlinter.contracts]]
name = "Core layer must not import from agents or services"
type = "forbidden"
source_modules = ["modules.backend.core"]
forbidden_modules = [
    "modules.backend.agents",
    "modules.backend.services",
]
ignore_imports = [
    # FastAPI dependency injection — core/dependencies.py resolves auth
    "modules.backend.core.dependencies -> modules.backend.services.auth",
]

# pytest-cov — Coverage
# =============================================================================
[tool.coverage.run]
source = ["modules"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
    "pass",
]
