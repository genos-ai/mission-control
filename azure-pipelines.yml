# CI gate for main. Azure Pipelines port of the former .github/workflows/ci.yml
# (Plan 84 Phase 1.1 / 1.3).
#
# Jobs:
#   Lint  — black + isort + flake8 (versions MUST match .pre-commit-config.yaml)
#   Rules — the project rule checker over the full tree
#   Tests — unit + integration suites against real Postgres/Redis (P12)
#
# MAKING THIS GATE UNSKIPPABLE
#   Azure Repos Git ignores the `pr:` trigger key, so PR validation is not
#   configured here. Set it in the Azure DevOps UI instead:
#     Repos → Branches → main → Branch policies → Build validation
#     → add this pipeline, set Policy requirement to "Required"
#   GitHub gated that behind a paid plan, which is why the old workflow settled
#   for advisory-only checks. Azure includes it at every tier, so the compromise
#   recorded in the GitHub workflow header can now be closed.
#
# PORTING NOTES (differences from GitHub Actions, not preferences)
#   1. Azure does not wait for service-container health before starting a job.
#      GitHub's `options: --health-cmd` did. Hence the explicit wait step.
#   2. `$(...)` is Azure macro syntax, evaluated before the shell sees it. The
#      GitHub config used `$(python -c ...)` shell substitution inside sed, which
#      is unsafe here, so config bootstrap is done in Python instead.
#   3. Jobs run in parallel with no `dependsOn`. On a tenant with one parallel
#      job they queue instead, which is slower but still correct.

trigger:
  branches:
    include:
      - main

variables:
  PYTHON_VERSION: "3.14"
  # Pinned to .pre-commit-config.yaml. Skew between local hooks and CI
  # reformats endlessly.
  BLACK_VERSION: "26.3.1"
  ISORT_VERSION: "8.0.1"
  FLAKE8_VERSION: "7.3.0"
  # Single source for the lint and rules target list.
  PY_TARGETS: "modules/backend modules/clients tests scripts mc.py admin.py services.py tui.py"

resources:
  containers:
    - container: postgres
      image: postgres:16
      ports:
        - 5432:5432
      env:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: mission_control_test
    - container: redis
      image: redis:7
      ports:
        - 6379:6379

jobs:
  - job: Lint
    displayName: Lint
    pool:
      vmImage: ubuntu-latest
    steps:
      - task: UsePythonVersion@0
        displayName: Use Python $(PYTHON_VERSION)
        inputs:
          versionSpec: $(PYTHON_VERSION)

      - script: pip install black==$(BLACK_VERSION) isort==$(ISORT_VERSION) flake8==$(FLAKE8_VERSION)
        displayName: Install pinned formatters

      - script: black --check --line-length=100 $(PY_TARGETS)
        displayName: black --check

      - script: isort --check-only $(PY_TARGETS)
        displayName: isort --check-only

      - script: flake8 $(PY_TARGETS)
        displayName: flake8

  - job: Rules
    displayName: Code rules
    pool:
      vmImage: ubuntu-latest
    steps:
      - task: UsePythonVersion@0
        displayName: Use Python $(PYTHON_VERSION)
        inputs:
          versionSpec: $(PYTHON_VERSION)

      - script: python scripts/code_rules_fast.py --all
        displayName: Code rules (full tree)

  - job: Tests
    displayName: Tests
    pool:
      vmImage: ubuntu-latest
    services:
      postgres: postgres
      redis: redis
    variables:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/mission_control_test
      TEST_REDIS_URL: redis://localhost:6379/1
    steps:
      - task: UsePythonVersion@0
        displayName: Use Python $(PYTHON_VERSION)
        inputs:
          versionSpec: $(PYTHON_VERSION)

      - script: |
          set -euo pipefail
          pip install uv
          uv pip install --system -r requirements.txt
        displayName: Install dependencies

      # Porting note 1. The postgres:16 image runs initdb on a unix socket and
      # does not listen on TCP until it is ready, so an accepted connection is a
      # sound readiness signal for both services.
      - script: |
          python - <<'PY'
          import socket
          import sys
          import time

          for name, port in (("postgres", 5432), ("redis", 6379)):
              for _ in range(60):
                  try:
                      with socket.create_connection(("localhost", port), timeout=2):
                          print(f"{name} is accepting connections on {port}")
                          break
                  except OSError:
                      time.sleep(2)
              else:
                  sys.exit(f"{name} never became reachable on port {port}")
          PY
        displayName: Wait for Postgres and Redis

      # Porting note 2. CI-only dummy secrets: get_settings() requires non-empty
      # db_password/jwt_secret/api_key_salt (enforced by test_config).
      - script: |
          set -euo pipefail
          cp config/.env.example config/.env
          python - <<'PY'
          import pathlib
          import secrets

          path = pathlib.Path("config/.env")
          text = path.read_text()
          for key, value in (
              ("DB_PASSWORD", "postgres"),
              ("JWT_SECRET", secrets.token_hex(32)),
              ("API_KEY_SALT", secrets.token_hex(16)),
          ):
              marker = f"{key}=\n"
              if marker not in text:
                  raise SystemExit(f"config/.env.example has no empty {key} line to fill")
              text = text.replace(marker, f"{key}={value}\n")
          path.write_text(text)
          PY
        displayName: Bootstrap config

      - script: pytest tests/unit -q -p no:cacheprovider --junitxml=junit/unit.xml
        displayName: Unit tests

      - script: pytest tests/integration -q -p no:cacheprovider --junitxml=junit/integration.xml
        displayName: Integration tests

      # Addition over the GitHub workflow: Azure surfaces JUnit results in the
      # build's Tests tab, giving per-test history and flaky detection that the
      # GitHub version did not report.
      - task: PublishTestResults@2
        displayName: Publish test results
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: JUnit
          testResultsFiles: junit/*.xml
          failTaskOnFailedTests: true
