# CI gate for main — Plan 84 Phase 1.1 / 1.3.
#
# Jobs:
#   lint  — black + isort + flake8 checks (revs MUST match .pre-commit-config.yaml)
#   rules — the project rule checker over the full tree
#   tests — unit + integration suites against real Postgres/Redis (P12)
#
# Branch protection would make these checks unskippable, but GitHub gates
# it behind a Pro/Team plan or a public repo. Decision: staying private on
# the free tier, so these checks remain advisory (CI runs, but a push to
# main isn't blocked on failure). Revisit if the plan ever changes.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install pinned formatters
        run: pip install black==26.3.1 isort==8.0.1 flake8==7.3.0
      - name: black --check
        run: >
          black --check --line-length=100
          modules/backend modules/clients tests scripts
          mc.py admin.py services.py tui.py
      - name: isort --check-only
        run: >
          isort --check-only
          modules/backend modules/clients tests scripts
          mc.py admin.py services.py tui.py
      - name: flake8
        run: >
          flake8
          modules/backend modules/clients tests scripts
          mc.py admin.py services.py tui.py

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Code rules (full tree)
        run: python scripts/code_rules_fast.py --all
      - name: Documentation references
        run: python scripts/check_docs.py

  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mission_control_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/mission_control_test
      TEST_REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          pip install uv
          uv pip install --system -r requirements.txt
      - name: Bootstrap config
        # CI-only dummy secrets: get_settings() requires non-empty
        # db_password/jwt_secret/api_key_salt (test_config enforces this).
        run: |
          cp config/.env.example config/.env
          sed -i 's/^DB_PASSWORD=$/DB_PASSWORD=postgres/' config/.env
          sed -i "s/^JWT_SECRET=$/JWT_SECRET=$(python -c 'import secrets; print(secrets.token_hex(32))')/" config/.env
          sed -i "s/^API_KEY_SALT=$/API_KEY_SALT=$(python -c 'import secrets; print(secrets.token_hex(16))')/" config/.env
      - name: Unit tests
        run: pytest tests/unit -q -p no:cacheprovider
      - name: Integration tests
        run: pytest tests/integration -q -p no:cacheprovider
